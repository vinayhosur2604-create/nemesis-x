<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>NEMESIS-X</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#05070B;--p:rgba(14,20,32,.62);--b:rgba(0,229,255,.18);--c:#00E5FF;--v:#8257FF;--a:#FFB547;--r:#FF3B55;--t:#E6F1F7;--m:#7C8CA0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--t);font:13px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;overflow:hidden}
body.alt{--c:#8257FF;--b:rgba(130,87,255,.28)}
#bg{position:fixed;inset:0;z-index:0}
.grid{position:fixed;inset:0;z-index:0;background-image:linear-gradient(var(--b) 1px,transparent 1px),linear-gradient(90deg,var(--b) 1px,transparent 1px);background-size:56px 56px;opacity:.16;animation:g 14s linear infinite;mask-image:radial-gradient(circle at 50% 30%,#000,transparent 75%)}
@keyframes g{to{background-position:56px 56px}}
#intro{position:fixed;inset:0;z-index:99;background:#000;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center}
#intro canvas{position:absolute;inset:0}
#it{position:relative;margin-top:150px;opacity:0}
#it h1{font:200 52px/1 "Segoe UI",system-ui,sans-serif;letter-spacing:.5em;margin:0 0 12px;color:var(--c);text-shadow:0 0 24px rgba(0,229,255,.5)}
#it p{letter-spacing:.3em;font-size:11px;color:var(--m);margin:0}
#scan{position:absolute;left:0;right:0;height:2px;background:var(--c);box-shadow:0 0 30px var(--c);top:-5px;opacity:0}
button{font:inherit;color:var(--t);background:rgba(0,229,255,.06);border:1px solid var(--b);border-radius:6px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--c);box-shadow:0 0 12px rgba(0,229,255,.25)}
#skip{position:absolute;right:24px;bottom:24px;letter-spacing:.2em;font-size:11px}
#app{position:relative;z-index:1;height:100%;display:grid;grid-template-rows:52px 1fr;opacity:0}
#top{display:flex;align-items:center;gap:16px;padding:0 16px;border-bottom:1px solid var(--b);background:var(--p);backdrop-filter:blur(14px)}
.brand{letter-spacing:.35em;font-weight:600;color:var(--c)}
.pill{border:1px solid var(--b);border-radius:20px;padding:2px 10px;font-size:11px;color:var(--m);white-space:nowrap}
.pill i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--m);margin-right:6px}
.pill.ok i{background:#3DDC97}.pill.bad i{background:var(--a)}
.sp{flex:1}
#main{display:flex;min-height:0}
#side{width:216px;transition:width .3s;border-right:1px solid var(--b);background:var(--p);backdrop-filter:blur(14px);padding:10px 8px;overflow:hidden;flex:none}
#side.col{width:58px}
.nav{position:relative;display:flex;gap:12px;align-items:center;padding:9px 12px;border-radius:6px;color:var(--m);cursor:pointer;white-space:nowrap;margin-bottom:2px;transition:.25s}
.nav b{width:18px;text-align:center;font-weight:400;flex:none}
.nav:hover{color:var(--t)}
.nav.on{color:var(--c);background:linear-gradient(90deg,rgba(0,229,255,.14),transparent);box-shadow:inset 2px 0 var(--c)}
#view{flex:1;overflow:auto;padding:20px 24px;min-width:0}
.v{display:none}.v.on{display:block}
h2{font-weight:300;letter-spacing:.2em;margin:0 0 4px;font-size:20px}
.sub{color:var(--m);margin-bottom:16px;max-width:820px}
.g{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.card{background:var(--p);border:1px solid var(--b);border-radius:10px;padding:14px;backdrop-filter:blur(12px);position:relative;min-width:0}
.card h3{margin:0 0 8px;font-size:11px;letter-spacing:.22em;color:var(--c);font-weight:600}
.empty{color:var(--m);border:1px dashed rgba(124,140,160,.3);border-radius:8px;padding:14px;text-align:center;font-size:12px}
.empty em{display:block;font-style:normal;color:var(--a);letter-spacing:.2em;font-size:10px;margin-bottom:4px}
.stat{font:200 30px/1.1 "Segoe UI",system-ui,sans-serif;color:var(--t)}
.stat small{display:block;font:11px system-ui;color:var(--m);letter-spacing:.15em;margin-top:4px}
.wide{grid-column:1/-1}
.sc{height:300px;border-radius:8px;overflow:hidden;background:#03050a;position:relative}
.sc canvas{display:block;width:100%;height:100%}
.sc .empty{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(5,7,11,.8);max-width:80%}
#tl{height:70px;position:relative;border-top:1px solid var(--b);margin-top:8px}
#tl span{position:absolute;top:6px;font-size:10px;color:var(--m);transform:translateX(-50%)}
#tl span:before{content:"";position:absolute;left:50%;top:-8px;height:6px;border-left:1px solid var(--b)}
#ws{display:grid;grid-template-columns:230px minmax(0,1fr) 260px;gap:14px}
@media(max-width:1100px){#ws{grid-template-columns:1fr}}
#drop{border:1px dashed var(--b);border-radius:8px;padding:18px 8px;text-align:center;color:var(--m);cursor:pointer}
#drop.h{border-color:var(--c);background:rgba(0,229,255,.06)}
.stage{position:relative;background:#000;border-radius:8px;aspect-ratio:16/9;overflow:hidden;border:1px solid var(--b)}
.stage video,.stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.stage .empty{position:absolute;inset:0;margin:auto;height:fit-content;width:fit-content;background:none;border:0}
.ctl{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px}
input[type=range]{flex:1;min-width:120px;accent-color:var(--c)}
select{background:#0a0f18;color:var(--t);border:1px solid var(--b);border-radius:6px;padding:5px}
#log{font:11px ui-monospace,Consolas,monospace;color:var(--m);max-height:130px;overflow:auto}
#ai{position:fixed;right:0;top:52px;bottom:0;width:340px;z-index:5;transform:translateX(100%);transition:transform .35s;background:rgba(8,12,20,.94);border-left:1px solid var(--b);backdrop-filter:blur(16px);padding:14px;display:flex;flex-direction:column;gap:10px}
#ai.on{transform:none}
#msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px}
.m{padding:8px 10px;border-radius:8px;border:1px solid var(--b)}.m.u{background:rgba(0,229,255,.08)}.m.s{border-color:rgba(255,181,71,.35);color:var(--a)}
input[type=text]{width:100%;background:#0a0f18;color:var(--t);border:1px solid var(--b);border-radius:6px;padding:8px}
.tag{display:inline-block;font-size:10px;letter-spacing:.12em;padding:1px 7px;border-radius:4px;border:1px solid;margin-right:4px}
@media (prefers-reduced-motion:reduce){.grid{animation:none}}
</style></head><body>
<div class="grid"></div><canvas id="bg"></canvas>

<div id="intro"><canvas id="ic"></canvas><div id="scan"></div>
<div id="it"><h1>NEMESIS-X</h1><p>UNDERSTANDING EVENTS THAT HAVE NEVER BEEN SEEN BEFORE</p></div>
<button id="skip">SKIP INTRO ›</button></div>

<div id="app">
<header id="top"><button id="tg" title="Collapse sidebar">☰</button><span class="brand">NEMESIS-X</span>
<span class="pill" id="pb"><i></i>BACKEND: CHECKING</span>
<span class="pill" id="ps"><i></i>PROCESSING: IDLE</span>
<span class="pill" id="pv">SESSION: NO VIDEO</span>
<span class="pill" id="pg">GPU: UNAVAILABLE</span>
<span class="sp"></span>
<button id="th">Accent</button><button id="ab">AI Reasoning</button><button id="st" data-go="config">Settings</button></header>
<div id="main"><nav id="side"></nav><main id="view"></main></div>
<aside id="ai"><h3 style="margin:0;color:var(--c);letter-spacing:.2em;font-size:11px">AI REASONING</h3>
<div id="msgs"><div class="m s">Answers are generated only from processed video observations. None exist yet.</div></div>
<input type="text" id="q" placeholder="What happened during this video?"></aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=(s,r=document)=>r.querySelector(s);
const S={video:null,log:[]};
const E=(t,d)=>`<div class="empty"><em>${t}</em>${d||''}</div>`;
const NO=(d)=>E('NO DATA',d||'Awaiting backend processing.');

/* ---------- Intro ---------- */
(function(){
 const c=$('#ic'),x=c.getContext('2d');let W,H,pts=[],t0=performance.now(),done=false;
 const rs=()=>{W=c.width=innerWidth;H=c.height=innerHeight};rs();addEventListener('resize',rs);
 for(let i=0;i<110;i++)pts.push({x:Math.random(),y:Math.random(),s:Math.random()*2.2,d:Math.random()*1800});
 function hex(cx,cy,r,a){x.beginPath();for(let i=0;i<6;i++){const q=Math.PI/3*i-Math.PI/2;x[i?'lineTo':'moveTo'](cx+r*Math.cos(q),cy+r*Math.sin(q))}x.closePath();x.globalAlpha=a;x.stroke()}
 function f(){if(done)return;const t=performance.now()-t0;x.clearRect(0,0,W,H);
  const cx=W/2,cy=H/2-20,k=Math.min(1,Math.max(0,(t-1500)/1500));
  pts.forEach(p=>{const a=Math.min(1,Math.max(0,(t-p.d)/600));const px=p.x*W+(cx-p.x*W)*k*.55,py=p.y*H+(cy-p.y*H)*k*.55;p.px=px;p.py=py;x.fillStyle='#00E5FF';x.globalAlpha=a*.8;x.beginPath();x.arc(px,py,p.s,0,7);x.fill()});
  if(t>900){x.strokeStyle='#00E5FF';x.lineWidth=.6;for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){const d=Math.hypot(pts[i].px-pts[j].px,pts[i].py-pts[j].py);if(d<95){x.globalAlpha=(1-d/95)*.35*Math.min(1,(t-900)/800);x.beginPath();x.moveTo(pts[i].px,pts[i].py);x.lineTo(pts[j].px,pts[j].py);x.stroke()}}}
  if(t>2300){const a=Math.min(1,(t-2300)/900);x.strokeStyle='#00E5FF';x.lineWidth=1.5;x.shadowColor='#00E5FF';x.shadowBlur=18;hex(cx,cy,60,a);hex(cx,cy,38,a*.7);x.beginPath();x.moveTo(cx,cy-24);x.lineTo(cx+22,cy+14);x.lineTo(cx-22,cy+14);x.closePath();x.globalAlpha=a;x.strokeStyle='#8257FF';x.stroke();x.shadowBlur=0}
  requestAnimationFrame(f)}
 f();
 gsap.to('#it',{opacity:1,duration:1,delay:3});
 gsap.fromTo('#scan',{top:-5,opacity:1},{top:'105%',duration:1.6,delay:3.4,ease:'power1.inOut'});
 function end(){if(done)return;done=true;gsap.to('#intro',{opacity:0,duration:.7,onComplete:()=>$('#intro').remove()});gsap.to('#app',{opacity:1,duration:.9});}
 $('#skip').onclick=end;setTimeout(end,5600);
})();

/* ---------- Navigation / views ---------- */
const NAV=[['overview','Overview','◈'],['video','Video Analysis','▶'],['events','Event Intelligence','⌬'],['tracking','Object Tracking','◎'],['memory','Temporal Memory','∞'],['spatial','Spatial Intelligence','⬡'],['anomaly','Anomaly Detection','△'],['evidence','Evidence Explorer','▣'],['config','System Configuration','⚙']];
const INFO={
 events:['Event Intelligence','Combines observations across time into event candidates. No conclusions are predefined.',[['EVENT RECORDS','Event ID · start/end · objects · identities · location · interactions · anomaly score · confidence · evidence'],['EVENT RELATIONSHIP GRAPH','Appears → moves → interacts → behaviour changes → candidate. Illustrative structure only; nothing is classified as criminal or dangerous.']]],
 tracking:['Object Tracking','Persistent IDs, trails, re-identification, appearance timestamps and track confidence.',[['TRACK LIST','Populated by the multi-object tracker.'],['TRACK PROFILE','Click a track to open its movement history.']]],
 memory:['Temporal Memory','What happened before, what is happening now, and how observations relate.',[['MEMORY GRAPH','Previous and current observations, state transitions, repeated interactions.'],['CHRONOLOGICAL NAVIGATOR','Step through stored observations in order.']]],
 anomaly:['Anomaly Detection','Every candidate must carry evidence. A score is never proof of wrongdoing.',[['STATISTICAL ANOMALIES','Deviations from observed temporal patterns.'],['MODEL-GENERATED CANDIDATES','Flagged by a model, not verified.'],['HUMAN-VERIFIED EVENTS','Confirmed by a reviewer.']]],
 evidence:['Evidence Explorer','Every explanation must trace to real video: references, timestamps, extracted frames, tracks, reasoning and limitations.',[['EVIDENCE ITEMS','Selecting one will seek the player to its timestamp.'],['REASONING & LIMITATIONS','Explanation plus uncertainty for each event.']]],
 config:['System Configuration','Model, device and pipeline options are read from the backend configuration.',[['DEVICE','CUDA / CPU selection is reported by the backend.'],['DETECTION & TRACKING MODELS','Reported by the backend once connected.']]]
};
const side=$('#side'),view=$('#view');
NAV.forEach(([id,l,i])=>{side.insertAdjacentHTML('beforeend',`<div class="nav" data-go="${id}"><b>${i}</b><span>${l}</span></div>`);});
const V={};
V.overview=`<h2>OVERVIEW</h2><div class="sub">Command-center summary. Every value originates from backend processing; none is displayed until it exists.</div>
<div class="g"><div class="card"><div class="stat">0<small>VIDEOS PROCESSED</small></div></div>
<div class="card"><div class="stat" id="ovd">—<small>LOADED VIDEO DURATION</small></div></div>
<div class="card"><div class="stat">—<small>DETECTED OBJECTS</small></div></div>
<div class="card"><div class="stat">—<small>TRACKED IDENTITIES / EVENTS</small></div></div>
<div class="card wide"><h3>SPATIAL INTELLIGENCE (3D)</h3><div class="sc" id="sc1"></div></div>
<div class="card wide"><h3>TEMPORAL EVENT TIMELINE</h3><div id="tl"></div><div id="tle">${NO('No events detected. Event markers will appear here and seek the video when clicked.')}</div></div>
<div class="card wide"><h3>SYSTEM PERFORMANCE</h3><div class="g">${['CPU','GPU','VRAM','RAM','PROCESSING FPS'].map(k=>`<div class="empty"><em>UNAVAILABLE</em>${k}</div>`).join('')}</div><div class="sub" style="margin:8px 0 0">Metrics are shown only when the backend reports them.</div></div></div>`;
V.video=`<h2>VIDEO ANALYSIS</h2><div class="sub">Playback runs locally in your browser. Detection, tracking and events require the backend pipeline.</div>
<div id="ws"><div class="card"><h3>INPUT</h3><div id="drop">Drop MP4 / AVI / MOV here<br>or click to browse</div><input id="fi" type="file" accept="video/*" hidden>
<h3 style="margin-top:16px">LIBRARY</h3><div id="lib">${NO('No videos this session.')}</div>
<h3 style="margin-top:16px">ANALYSIS</h3><button disabled style="width:100%">Run analysis (backend required)</button></div>
<div class="card"><div class="stage"><video id="vp" playsinline></video><canvas id="ov"></canvas><div class="empty" id="ve"><em>NO VIDEO LOADED</em>Load a file to begin.</div></div>
<div class="ctl"><button id="pp">Play</button><button id="fb">◂ Frame</button><button id="ff">Frame ▸</button>
<input type="range" id="sk" min="0" max="1000" value="0"><span id="tm">0:00.00 / 0:00.00</span>
<select id="sp"><option>0.25</option><option>0.5</option><option selected>1</option><option>1.5</option><option>2</option></select><button id="ss">Screenshot</button></div>
<div class="sub" style="margin:8px 0 0;font-size:11px">Frame step assumes 1/30 s; true frame rate comes from the backend. Overlay layer: no detections.</div></div>
<div><div class="card"><h3>DETECTIONS</h3>${NO()}</div><div class="card" style="margin-top:14px"><h3>IDENTITIES · EVENTS</h3>${NO()}</div><div class="card" style="margin-top:14px"><h3>PROCESSING LOG</h3><div id="log"></div></div></div></div>`;
V.spatial=`<h2>SPATIAL INTELLIGENCE</h2><div class="sub">Plots only coordinates reported by the pipeline. Image-plane coordinates from monocular video are not metric 3D positions.</div><div class="card"><div class="sc" id="sc2" style="height:460px"></div></div>`;
Object.keys(INFO).forEach(k=>{const[t,d,cs]=INFO[k];V[k]=`<h2>${t.toUpperCase()}</h2><div class="sub">${d}</div><div class="g">${cs.map(([a,b])=>`<div class="card"><h3>${a}</h3>${NO(b)}</div>`).join('')}</div>`});
NAV.forEach(([id])=>view.insertAdjacentHTML('beforeend',`<section class="v" id="v-${id}">${V[id]}</section>`));

function go(id){document.querySelectorAll('.v').forEach(e=>e.classList.toggle('on',e.id==='v-'+id));
 document.querySelectorAll('.nav').forEach(e=>e.classList.toggle('on',e.dataset.go===id));
 gsap.fromTo('#v-'+id,{opacity:0,y:10},{opacity:1,y:0,duration:.4});}
document.addEventListener('click',e=>{const n=e.target.closest('[data-go]');if(n)go(n.dataset.go)});
$('#tg').onclick=()=>side.classList.toggle('col');
$('#th').onclick=()=>document.body.classList.toggle('alt');
$('#ab').onclick=()=>$('#ai').classList.toggle('on');
$('#q').onkeydown=e=>{if(e.key!=='Enter'||!e.target.value.trim())return;const m=$('#msgs');m.insertAdjacentHTML('beforeend',`<div class="m u"></div><div class="m s"><b>INSUFFICIENT EVIDENCE.</b> No processed video observations are available, so this cannot be determined.</div>`);m.children[m.children.length-2].textContent=e.target.value;e.target.value='';m.scrollTop=1e9};

/* ---------- Logging / status ---------- */
function log(s){S.log.push(s);$('#log').insertAdjacentHTML('beforeend',`<div>[${new Date().toLocaleTimeString()}] ${s}</div>`)}
const fmt=t=>{t=t||0;return Math.floor(t/60)+':'+(t%60).toFixed(2).padStart(5,'0')};
fetch('/api/health').then(r=>{if(!r.ok)throw 0;$('#pb').className='pill ok';$('#pb').innerHTML='<i></i>BACKEND: ONLINE'}).catch(()=>{$('#pb').className='pill bad';$('#pb').innerHTML='<i></i>BACKEND: OFFLINE';log('Backend /api/health unreachable. Analysis disabled.')});

/* ---------- Video workspace (real local playback) ---------- */
const vp=$('#vp'),drop=$('#drop'),fi=$('#fi');
drop.onclick=()=>fi.click();fi.onchange=()=>load(fi.files[0]);
drop.ondragover=e=>{e.preventDefault();drop.classList.add('h')};drop.ondragleave=()=>drop.classList.remove('h');
drop.ondrop=e=>{e.preventDefault();drop.classList.remove('h');load(e.dataTransfer.files[0])};
function load(f){if(!f)return;if(!f.type.startsWith('video/')){log('Rejected non-video file: '+f.name);return}
 vp.src=URL.createObjectURL(f);S.video={name:f.name};$('#ve').style.display='none';
 $('#lib').innerHTML=`<div class="pill" style="display:block;overflow:hidden;text-overflow:ellipsis">${f.name.replace(/</g,'&lt;')}</div>`;
 $('#pv').textContent='SESSION: '+f.name;log('Loaded '+f.name+' ('+(f.size/1048576).toFixed(1)+' MB). Not yet analysed.');}
vp.onloadedmetadata=()=>{S.video.duration=vp.duration;$('#ovd').innerHTML=fmt(vp.duration)+'<small>LOADED VIDEO DURATION</small>';ticks();upd()};
function ticks(){const d=S.video.duration,tl=$('#tl');tl.innerHTML='';for(let i=0;i<=8;i++)tl.insertAdjacentHTML('beforeend',`<span style="left:${i*12.5}%">${fmt(d*i/8)}</span>`)}
function upd(){$('#tm').textContent=fmt(vp.currentTime)+' / '+fmt(vp.duration);if(vp.duration)$('#sk').value=vp.currentTime/vp.duration*1000}
vp.ontimeupdate=upd;
$('#pp').onclick=()=>{if(!vp.src)return;vp.paused?vp.play():vp.pause()};vp.onplay=()=>$('#pp').textContent='Pause';vp.onpause=()=>$('#pp').textContent='Play';
$('#ff').onclick=()=>{vp.pause();vp.currentTime+=1/30};$('#fb').onclick=()=>{vp.pause();vp.currentTime-=1/30};
$('#sk').oninput=e=>{if(vp.duration)vp.currentTime=e.target.value/1000*vp.duration};
$('#sp').onchange=e=>vp.playbackRate=+e.target.value;
$('#ss').onclick=()=>{if(!vp.videoWidth)return;const c=document.createElement('canvas');c.width=vp.videoWidth;c.height=vp.videoHeight;c.getContext('2d').drawImage(vp,0,0);const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='frame_'+vp.currentTime.toFixed(2)+'s.png';a.click();log('Screenshot saved at '+fmt(vp.currentTime))};

/* ---------- Three.js: empty coordinate environment (no fabricated markers) ---------- */
function scene(el){const r=new THREE.WebGLRenderer({antialias:true,alpha:true});el.appendChild(r.domElement);
 const s=new THREE.Scene(),cam=new THREE.PerspectiveCamera(50,1,.1,100);
 const gr=new THREE.GridHelper(20,20,0x00E5FF,0x12384a);gr.material.opacity=.5;gr.material.transparent=true;s.add(gr);s.add(new THREE.AxesHelper(4));
 let az=.8,el2=.5,dist=18,drag=false,lx,ly;
 const cv=r.domElement;cv.onmousedown=e=>{drag=true;lx=e.clientX;ly=e.clientY};addEventListener('mouseup',()=>drag=false);
 cv.onmousemove=e=>{if(!drag)return;az-=(e.clientX-lx)*.01;el2=Math.min(1.4,Math.max(.05,el2+(e.clientY-ly)*.01));lx=e.clientX;ly=e.clientY};
 cv.onwheel=e=>{e.preventDefault();dist=Math.min(40,Math.max(6,dist+e.deltaY*.02))};
 el.insertAdjacentHTML('beforeend',E('NO SPATIAL DATA','Drag to orbit · scroll to zoom. Markers and trajectories appear only from pipeline output.'));
 (function a(){requestAnimationFrame(a);if(!el.offsetParent)return;const w=el.clientWidth,h=el.clientHeight;if(r.domElement.width!==w*devicePixelRatio){r.setPixelRatio(devicePixelRatio);r.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
  if(!drag)az+=.0015;cam.position.set(dist*Math.cos(el2)*Math.sin(az),dist*Math.sin(el2),dist*Math.cos(el2)*Math.cos(az));cam.lookAt(0,0,0);r.render(s,cam)})();}
scene($('#sc1'));scene($('#sc2'));

/* ---------- Ambient particle backdrop ---------- */
(function(){const c=$('#bg'),x=c.getContext('2d');let W,H;const P=Array.from({length:60},()=>({x:Math.random(),y:Math.random(),v:.00004+Math.random()*.00008}));
 const rs=()=>{W=c.width=innerWidth;H=c.height=innerHeight};rs();addEventListener('resize',rs);
 (function f(){requestAnimationFrame(f);x.clearRect(0,0,W,H);x.fillStyle='rgba(0,229,255,.35)';P.forEach(p=>{p.y-=p.v*16;if(p.y<0)p.y=1;x.fillRect(p.x*W,p.y*H,1.5,1.5)})})();})();

go('overview');
</script></body></html>
